# Refresh INFO snapshots and push so Netlify rebuilds with new public/info/*.json.
name: INFO ingest

on:
  schedule:
    # About every 20 minutes (GitHub schedule is best-effort).
    - cron: '5,25,45 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Ingest news
        run: npm run info:news
      - name: Ingest football
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: npm run info:football
      - name: Commit published snapshots
        run: |
          git config user.name 'tvn-info-bot'
          git config user.email 'tvn-info-bot@users.noreply.github.com'
          git add public/info/news.json public/info/football.json
          if git diff --staged --quiet; then
            echo 'No INFO snapshot changes'
            exit 0
          fi
          git commit -m "Refresh INFO news and football snapshots."
          git push

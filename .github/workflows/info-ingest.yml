# Refresh INFO snapshots into Netlify Blobs via /api/info/publish.
# Does NOT commit JSON to git and does NOT trigger a Netlify application rebuild.
name: INFO ingest

on:
  schedule:
    # News: about every 30 minutes (GitHub schedule is best-effort).
    - cron: '7,37 * * * *'
    # Football windows in Europe/London, both GMT and BST:
    # Mon–Fri 22:00; Sat 17:00, 19:30, 22:30; Sun 16:00, 18:00, 20:00, 22:00.
    # ingest-football.ts gates with timezone-aware slot keys.
    - cron: '0,15,30,45 15,16,17,18,19,20,21,22 * * *'
  workflow_dispatch:
    inputs:
      force_football:
        description: 'Force an extra football update now (admin)'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Restore football slot marker
        uses: actions/cache@v4
        with:
          path: .cache/info-football-slot
          key: tvn-football-slot-${{ github.run_id }}
          restore-keys: |
            tvn-football-slot-
      - name: Ingest news
        run: npm run info:news
      - name: Ingest football
        id: football
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          FOOTBALL_INGEST_FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: npm run info:football
      - name: Publish to Netlify Blobs
        env:
          INFO_PUBLISH_URL: ${{ secrets.INFO_PUBLISH_URL }}
          INFO_PUBLISH_SECRET: ${{ secrets.INFO_PUBLISH_SECRET }}
          INFO_PUBLISH_FOOTBALL: ${{ steps.football.outputs.wrote }}
        run: npm run info:publish

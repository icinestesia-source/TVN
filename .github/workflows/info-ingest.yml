# Refresh INFO snapshots into Netlify Blobs via /api/info/publish.
# Does NOT commit JSON to git and does NOT trigger a Netlify application rebuild.
name: INFO ingest

on:
  schedule:
    # About every 30 minutes (GitHub schedule is best-effort).
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Ingest news
        run: npm run info:news
      - name: Ingest football
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: npm run info:football
      - name: Publish to Netlify Blobs
        env:
          INFO_PUBLISH_URL: ${{ secrets.INFO_PUBLISH_URL }}
          INFO_PUBLISH_SECRET: ${{ secrets.INFO_PUBLISH_SECRET }}
        run: npm run info:publish

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TVN Harvester</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg: #0d0f12; --panel: #161a20; --line: #262c35; --ink: #e8ecf1; --dim: #8a94a3; --accent: #f5c84b; --good: #5fcf86; --warn: #f0a24b; --bad: #ef5d5d; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
  header { display: flex; align-items: baseline; gap: 16px; padding: 14px 20px; border-bottom: 1px solid var(--line); }
  header h1 { margin: 0; font-size: 15px; letter-spacing: 0.12em; color: var(--accent); }
  header .sub { color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  main { display: grid; grid-template-columns: minmax(420px, 1fr) minmax(420px, 1.2fr); gap: 16px; padding: 16px 20px; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 14px; }
  h2 { margin: 0 0 10px; font-size: 11px; letter-spacing: 0.14em; color: var(--dim); font-weight: 600; }
  button { font: inherit; letter-spacing: 0.08em; padding: 8px 12px; border-radius: 4px; border: 1px solid var(--line); background: #1f252e; color: var(--ink); cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: 0.35; cursor: default; }
  button.primary { background: var(--accent); color: #111; border-color: var(--accent); font-weight: 700; }
  button.stop { background: var(--bad); color: #fff; border-color: var(--bad); font-weight: 700; }
  button.x { padding: 0 7px; line-height: 1.5; }
  kbd { color: var(--dim); font-size: 10px; margin-left: 4px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
  input[type=text] { font: inherit; flex: 1; min-width: 240px; padding: 7px 9px; background: #0f1216; color: var(--ink); border: 1px solid var(--line); border-radius: 4px; }
  input.short { flex: 0 0 76px; min-width: 76px; }
  label.inline { color: var(--dim); }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 3px 14px; margin: 0; }
  dt { color: var(--dim); }
  dd { margin: 0; overflow-wrap: anywhere; }
  .state { font-weight: 700; letter-spacing: 0.1em; }
  .state.running { color: var(--good); } .state.stopping { color: var(--warn); } .state.idle { color: var(--dim); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .chip { padding: 3px 8px; border-radius: 10px; border: 1px solid var(--line); }
  .c-HEALTHY { color: var(--good); } .c-FAIR { color: #b8d36a; } .c-THIN { color: var(--warn); } .c-EMPTY, .c-BROKEN { color: var(--bad); }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 3px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td.wrap { white-space: normal; overflow-wrap: anywhere; }
  th { color: var(--dim); font-weight: 600; }
  td.num { text-align: right; }
  .scroll { max-height: 360px; overflow: auto; }
  #log { max-height: 320px; overflow: auto; white-space: pre-wrap; font-size: 12px; }
  #log .warn { color: var(--warn); } #log .error { color: var(--bad); }
  .notice { color: var(--accent); margin-top: 6px; min-height: 1.4em; }
  .wide { grid-column: 1 / -1; }
  .desk-head { display: flex; gap: 14px; align-items: baseline; flex-wrap: wrap; margin-bottom: 6px; }
  .desk-head .num { font-size: 22px; color: var(--accent); font-weight: 700; }
  .desk-head .name { font-size: 18px; font-weight: 700; }
  .badge { padding: 2px 8px; border-radius: 10px; border: 1px solid var(--line); font-size: 11px; letter-spacing: 0.1em; }
  .desc { color: var(--ink); margin: 4px 0; max-width: 110ch; }
  .dim { color: var(--dim); }
  .metrics { display: grid; grid-template-columns: repeat(6, minmax(90px, 1fr)); gap: 8px; margin: 10px 0; }
  .metric { border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; }
  .metric b { display: block; font-size: 16px; }
  .metric span { color: var(--dim); font-size: 11px; letter-spacing: 0.08em; }
  .desk-grid { display: grid; grid-template-columns: 1.3fr 1fr; gap: 16px; }
  .pending { display: grid; grid-template-columns: 1fr max-content max-content max-content; gap: 4px 10px; align-items: center; margin-bottom: 10px; }
  .pending .url { overflow-wrap: anywhere; }
  .s-READY, .s-ADDED { color: var(--good); } .s-UNKNOWN, .s-FAILED { color: var(--bad); } .s-ALREADY, .s-EXISTING, .s-PARTIAL, .s-SCANNING { color: var(--warn); }
  .compare { display: grid; grid-template-columns: max-content repeat(3, max-content); gap: 2px 18px; margin-bottom: 8px; }
  .compare .h { color: var(--dim); }
  .added { color: var(--good); }
</style>
</head>
<body>
<header><h1>TVN HARVESTER</h1><span class="sub" id="where">No workspace open</span></header>
<main>
  <section class="wide" id="desk">
    <h2>SOURCE DESK · CENTRAL NETWORK FROM 001</h2>
    <div class="row">
      <button id="previous">◀ PREVIOUS<kbd>P</kbd></button>
      <button id="next">NEXT ▶<kbd>N</kbd></button>
      <label class="inline" for="goto">GO TO</label><input type="text" class="short" id="goto" placeholder="001" inputmode="numeric">
      <button id="gotoButton">GO<kbd>G</kbd></button>
      <span class="dim" id="deskWhere"></span>
    </div>
    <div class="desk-head"><span class="num" id="dNum">—</span><span class="name" id="dName"></span><span class="badge" id="dState"></span><span class="badge" id="dHealth"></span><span class="badge" id="dGap"></span><span class="dim" id="dLayer"></span></div>
    <div class="desc" id="dDesc"></div>
    <div class="dim" id="dFilters"></div>
    <div class="metrics" id="dMetrics"></div>
    <div class="dim" id="dDiversity"></div>
    <div class="desk-grid">
      <div>
        <h2 style="margin-top:12px">EXISTING SOURCES</h2>
        <div class="scroll"><table id="dSources"></table></div>
      </div>
      <div>
        <h2 style="margin-top:12px">ADD SOURCES</h2>
        <div class="row"><input type="text" id="url" placeholder="Paste URL, ENTER (several at once is fine)" autocomplete="off" spellcheck="false"></div>
        <div class="pending" id="dPending"></div>
        <div class="row">
          <button class="primary" id="scan">SCAN SOURCES<kbd>S</kbd></button>
          <button id="scanNext">SCAN &amp; NEXT</button>
          <button id="skip">SKIP<kbd>K</kbd></button>
          <button class="stop" id="deskStop">STOP</button>
        </div>
        <div class="row">
          <button id="refreshChannel">AUTO REFRESH CHANNEL</button>
          <button id="needsMore">NEEDS MORE<kbd>M</kbd></button>
        </div>
        <div id="dCompare"></div>
      </div>
    </div>
    <h2 style="margin-top:12px">CENTRAL SOURCE DESK PROGRESS</h2>
    <dl id="dProgress"></dl>
  </section>

  <section id="setup">
    <h2>WORKSPACE</h2>
    <div class="row"><input type="text" id="dir" placeholder="Workspace folder"></div>
    <div class="row"><input type="text" id="master" placeholder="Complete Export to import (only for a new workspace)"></div>
    <div class="row"><button id="open">OPEN / CREATE WORKSPACE</button></div>
    <dl id="masterInfo"></dl>
    <div class="notice" id="notice"></div>
  </section>

  <section>
    <h2>AUTO</h2>
    <div class="row">
      <label class="inline" for="autoFrom">AUTO FROM</label><input type="text" class="short" id="autoFrom" value="001" inputmode="numeric">
      <label class="inline" for="autoTo">TO</label><input type="text" class="short" id="autoTo" value="ALL">
    </div>
    <div class="row">
      <button class="primary" id="start">START AUTO</button>
      <button class="stop" id="stop">STOP</button>
      <button id="resume">RESUME AUTO</button>
    </div>
    <div class="row">
      <button id="export">EXPORT CORPUS</button>
      <button id="report">WRITE REPORTS</button>
      <button id="folder">OPEN OUTPUT FOLDER</button>
    </div>
    <dl id="progress"></dl>
  </section>

  <section class="wide">
    <h2>CHANNEL HEALTH</h2>
    <div class="chips" id="chips"></div>
    <div class="scroll"><table id="health"></table></div>
  </section>

  <section class="wide">
    <h2>ACTIVITY</h2>
    <div id="log"></div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id)
const esc = (text) => String(text ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
const time = (ms) => { const s = Math.floor(ms / 1000); return `${Math.floor(s / 3600)}h ${String(Math.floor(s / 60) % 60).padStart(2, '0')}m ${String(s % 60).padStart(2, '0')}s` }
const pad = (n) => String(n).padStart(3, '0')
const hm = (seconds) => `${Math.floor(seconds / 3600)}h ${String(Math.floor(seconds / 60) % 60).padStart(2, '0')}m`
let state = null
let logLength = -1
let channels = []
let lastFull = 0

async function post(path, payload = {}) {
  const response = await fetch(path, { method: 'POST', headers: { 'content-type': 'application/json', 'x-harvester': '1' }, body: JSON.stringify(payload) })
  const body = await response.json().catch(() => ({}))
  if (!response.ok) $('notice').textContent = body.error || 'That did not work'
  await refresh()
  return response.ok
}

function dl(el, pairs) {
  el.innerHTML = pairs.filter(Boolean).map(([k, v]) => `<dt>${esc(k)}</dt><dd>${v}</dd>`).join('')
}

function renderDesk(s) {
  const d = s.desk
  if (!d) return
  const v = d.view
  const h = v.health
  const busy = s.progress.running
  $('deskWhere').textContent = `channel ${v.index} of ${v.total}`
  $('dNum').textContent = pad(v.channel.number)
  $('dName').textContent = v.channel.name
  $('dState').textContent = v.state
  $('dHealth').textContent = h ? h.class : 'NO HEALTH YET'
  $('dHealth').className = `badge c-${h ? h.class.split(' ')[0] : ''}`
  $('dGap').textContent = h && h.gap ? h.gap : ''
  $('dGap').style.display = h && h.gap ? '' : 'none'
  $('dLayer').textContent = `${v.channel.scope === 'central' ? (v.channel.layer === 'shipped' ? 'shipped channel' : 'shipped + master override') : 'User Network'}${v.channel.category ? ` · ${v.channel.category}` : ''}${v.channel.stableId ? ` · id ${v.channel.stableId}` : ''}`
  $('dDesc').textContent = v.channel.description || (v.channel.shippedAs ? `Shipped as ${pad(v.channel.number)} ${v.channel.shippedAs.name}: ${v.channel.shippedAs.description} (renamed ${v.channel.name} by the master's override)` : '')
  $('dFilters').textContent = v.channel.filters.length ? `Filters: ${v.channel.filters.join(' | ')}` : 'Filters: none'
  const m = (label, value) => `<div class="metric"><b>${esc(value)}</b><span>${esc(label)}</span></div>`
  $('dMetrics').innerHTML = h
    ? m('SOURCES', h.sourcesEnabled) + m('AVAILABLE', h.available) + m('ELIGIBLE', h.eligible) + m('SCHEDULED', h.scheduled) + m('PLAYABLE HRS', h.hours) + m('DATED', `${h.knownDatePct}%`)
    : ''
  $('dDiversity').textContent = h ? `${h.sourcesEnabled} enabled sources · ${h.creators} distinct creators${h.editorialExcluded ? ` · ${h.editorialExcluded} kept off by TVN's default exclusions` : ''}${h.held ? ` · ${h.held} held from the schedule` : ''}` : ''
  $('dSources').innerHTML = '<tr><th></th><th>PROVIDER</th><th>SOURCE</th><th>PROGRAMMES</th><th>LAST REFRESH</th><th>HEALTH</th><th>FROM</th></tr>' +
    v.sources.map((x) => `<tr><td>${x.enabled ? '✓' : '○'}</td><td>${esc(x.provider)}</td><td class="wrap" title="${esc(x.url)}">${esc(x.label)}${x.url ? `<br><span class="dim">${esc(x.url.replace(/^https?:\/\/(www\.)?/, ''))}</span>` : ''}</td><td class="num">${x.programmes}</td><td>${esc(x.lastRefresh ? x.lastRefresh.slice(0, 16).replace('T', ' ') : '—')}</td><td>${esc(x.enabled ? (x.partial ? 'PARTIAL' : x.status || 'NOT YET VISITED') : 'DISABLED')}</td><td class="dim">${esc({ master: 'export', shipped: 'shipped', desk: 'desk' }[x.provenance] || x.provenance)}</td></tr>`).join('')
  $('dPending').innerHTML = v.pending.map((p) => {
    const removable = !['SCANNING', 'ADDED', 'PARTIAL'].includes(p.status)
    const r = p.result
    const result = r ? `<div class="dim">${esc(r.label)} · +${r.programmes} programmes · +${r.eligible} eligible · +${hm(r.seconds)} · +${r.dated} dated${r.refused ? ` · ${r.refused} refused` : ''}${r.listed !== undefined ? ` · ${r.listed} listed` : ''}${r.complete ? '' : ' · not read to its end'}</div>` : ''
    return `<div class="url">${esc(p.url.replace(/^https?:\/\/(www\.)?/, ''))}${p.note ? `<div class="dim">${esc(p.note)}</div>` : ''}${result}</div><div class="dim">${esc(p.typeLabel)}</div><div class="s-${p.status.split(/[ —]/)[0]}">${esc(p.status)}</div><div>${removable ? `<button class="x" data-remove="${p.id}" title="Remove">×</button>` : ''}</div>`
  }).join('')
  const ready = v.pending.filter((p) => p.status === 'READY').length
  const partial = v.sources.some((x) => x.enabled && x.partial && x.provenance === 'desk')
  $('scan').disabled = busy || (!ready && !partial)
  $('scanNext').disabled = busy || (!ready && !partial)
  $('scan').textContent = ready ? `SCAN ${ready} SOURCE${ready === 1 ? '' : 'S'}` : partial ? 'CARRY ON PARTIAL' : 'SCAN SOURCES'
  $('deskStop').disabled = !busy || s.progress.stopping || s.progress.kind === 'auto'
  for (const id of ['refreshChannel']) $(id).disabled = busy
  for (const id of ['previous', 'next', 'skip', 'gotoButton', 'needsMore']) $(id).disabled = busy && s.progress.kind !== 'auto'
  const c = d.compare
  if (c && c.before) {
    const a = c.after
    const row = (label, key, unit = '') => `<div>${label}</div><div>${c.before[key]}${unit}</div><div>${a ? `${a[key]}${unit}` : '…'}</div><div class="added">${a ? `${a[key] - c.before[key] >= 0 ? '+' : ''}${Math.round((a[key] - c.before[key]) * 10) / 10}${unit}` : ''}</div>`
    $('dCompare').innerHTML = `<h2>${c.kind === 'desk' ? 'SCAN' : 'AUTO REFRESH'} RESULT · RUN ${c.runId}</h2><div class="compare"><div class="h"></div><div class="h">BEFORE</div><div class="h">AFTER</div><div class="h">ADDED</div>${row('Sources', 'sourcesEnabled')}${row('Available', 'available')}${row('Eligible', 'eligible')}${row('Playable', 'hours', 'h')}${row('Dated', 'knownDates')}</div>` +
      c.results.map((r) => `<div><b>${esc(r.label)}</b> <span class="s-${esc(r.status.split(/[ —]/)[0])}">${esc(r.status)}</span>${r.programmes ? ` · +${r.programmes} programmes · +${r.eligible} eligible · +${hm(r.seconds)} · +${r.dated} dated${r.refused ? ` · ${r.refused} refused` : ''}` : ''}${r.note ? ` <span class="dim">${esc(r.note)}</span>` : ''}</div>`).join('')
  } else $('dCompare').innerHTML = ''
  const g = d.progress
  dl($('dProgress'), [
    ['Channel', `${pad(g.channel.number)} · ${g.channel.position} / ${g.channel.total} (${g.channel.centralTotal} central)`],
    ['Reviewed', g.reviewed],
    ['Enriched', g.enriched],
    ['Skipped', g.skipped],
    ['Needs more', g.needsMore],
    ['New sources', g.newSources],
    ['New programmes', g.newProgrammes.toLocaleString()],
    ['New playable hours', g.newPlayableHours.toLocaleString()],
  ])
}

function render() {
  const s = state
  $('notice').textContent = s.notice || ''
  if (!s.workspace) {
    if (!$('dir').value) $('dir').value = s.suggested || ''
    for (const id of ['start', 'stop', 'resume', 'export', 'report', 'folder']) $(id).disabled = true
    return
  }
  const p = s.progress
  $('where').textContent = `${s.workspace.dir} · workspace ${s.workspace.id} · schema ${s.workspace.schema}`
  if (!$('dir').value) $('dir').value = s.workspace.dir
  const m = s.master
  dl($('masterInfo'), [
    ['Master', esc(m.filename)],
    ['Format', `${esc(m.format)} v${m.version} · app ${esc(m.app_commit)} / ${esc(m.app_build)}`],
    ['Imported', `${m.channels} user channels · ${m.central} overrides · ${m.sources} sources · ${m.programmes} programmes · ${m.dated} dated`],
    ['Master copy', m.intact ? '<span class="c-HEALTHY">UNCHANGED</span> (sha256 matches)' : '<span class="c-EMPTY">CHANGED OR MISSING</span>'],
    ['Shipped baseline', s.baseline ? `TVN ${esc(s.baseline.app_commit)} / ${esc(s.baseline.app_build)} · ${s.baseline.channels} channels · ${s.baseline.sources} original sources · ${s.baseline.programmes} programmes` : 'not read'],
  ])
  const run = s.lastRun
  const status = p.stopping ? 'stopping' : p.running ? 'running' : 'idle'
  $('start').disabled = p.running
  $('stop').disabled = !p.running || p.stopping
  $('resume').disabled = p.running || !s.unfinished
  $('resume').textContent = s.unfinished ? `RESUME AUTO (RUN ${s.unfinished.id}${s.unfinished.range_from ? ` · FROM ${pad(s.unfinished.range_from)}` : ''})` : 'RESUME AUTO'
  for (const id of ['export', 'report']) $(id).disabled = p.running
  $('folder').disabled = false
  const t = run ? run.totals : null
  const span = p.running ? p.range : run && run.range_from ? { from: run.range_from, to: run.range_to } : null
  const kind = p.kind ? { auto: 'AUTO', channel: 'AUTO REFRESH CHANNEL', desk: 'SCAN SOURCES' }[p.kind] : 'AUTO'
  dl($('progress'), [
    ['State', `<span class="state ${status}">${status === 'running' ? `RUNNING ${esc(kind)}` : status === 'stopping' ? 'STOPPING…' : run ? esc(run.status.toUpperCase()) : 'IDLE'}</span>${p.runId || run ? ` · run ${p.runId || run.id}` : ''}${span ? ` · channels ${pad(span.from)}–${span.to && span.to < 1e15 ? pad(span.to) : 'ALL'}` : ''}`],
    p.channel && ['Channel', `${p.channel.index} / ${p.channel.total} · ${pad(p.channel.number)} ${esc(p.channel.name)}`],
    p.source && ['Source', `${p.source.index} / ${p.source.total} · ${esc(p.source.label)} (${esc(p.source.sourceType)}, ${esc(p.source.depth)})`],
    p.source && ['URL', esc(p.source.url)],
    p.running && ['Known programmes', p.known],
    ['Last AUTO: new', t ? t.added : 0],
    ['Dates added', t ? t.datesAdded : 0],
    ['Enriched', t ? t.enriched : 0],
    ['Rejected / unplayable', t ? t.refused : 0],
    ['Sources', t ? `${t.sourcesDone} done · ${t.sourcesFailed} failed · ${t.sourcesSkipped} skipped · ${t.sourcesPending} to visit` : '—'],
    ['Requests', t ? t.requests : 0],
    ['Elapsed', time(p.running ? p.elapsedMs : run ? run.elapsed_ms : 0)],
  ])
  renderDesk(s)
  const summary = s.health.summary
  $('chips').innerHTML = Object.entries(summary).map(([k, v]) => `<span class="chip c-${k.split(' ')[0]}">${esc(k)} ${v}</span>`).join('') +
    Object.entries(s.health.gaps || {}).map(([k, v]) => `<span class="chip">${esc(k)} ${v}</span>`).join('') + `<span class="chip">${s.health.central} central · ${s.health.user} user</span>`
  if (s.health.channels) {
    channels = s.health.channels
    $('health').innerHTML = '<tr><th>CH</th><th>NAME</th><th>HEALTH</th><th>GAP</th><th>ELIGIBLE</th><th>HOURS</th><th>DATED</th><th>HELD</th><th>SOURCES</th><th>CREATORS</th></tr>' +
      channels.map((c) => `<tr data-channel="${c.number}"><td>${pad(c.number)}</td><td>${esc(c.name)}</td><td class="c-${c.class.split(' ')[0]}">${esc(c.class)}</td><td class="dim">${esc(c.gap || '')}</td><td class="num">${c.playable}</td><td class="num">${c.hours}</td><td class="num">${c.knownDatePct}%</td><td class="num">${c.held}</td><td class="num">${c.sourcesEnabled}/${c.sourcesConfigured}${c.brokenSources ? ` · ${c.brokenSources} broken` : ''}</td><td class="num">${c.creators}</td></tr>`).join('')
  }
  if (s.log.length !== logLength || (s.log.at(-1) && s.log.at(-1).at !== $('log').dataset.last)) {
    const log = $('log')
    const atBottom = log.scrollTop + log.clientHeight >= log.scrollHeight - 8
    log.innerHTML = s.log.map((l) => `<div class="${l.level}">${esc(l.at.slice(11, 19))} ${esc(l.message)}</div>`).join('')
    log.dataset.last = s.log.at(-1)?.at || ''
    logLength = s.log.length
    if (atBottom) log.scrollTop = log.scrollHeight
  }
}

async function refresh() {
  try {
    const full = Date.now() - lastFull > 15000
    state = await (await fetch(`/api/state${full ? '?health=1' : ''}`)).json()
    if (full) lastFull = Date.now()
    render()
  } catch {
    $('notice').textContent = 'Harvester is not answering'
  }
}

const desk = (action, payload) => post(`/api/desk/${action}`, payload)
const goTo = () => {
  const number = Number($('goto').value.trim())
  if (Number.isInteger(number) && number > 0) desk('goto', { number }).then(() => { $('goto').value = ''; $('url').focus() })
}
const addUrls = (text) => {
  if (!text.trim()) return
  desk('paste', { text })
}

$('url').addEventListener('keydown', (event) => {
  if (event.key !== 'Enter') return
  event.preventDefault()
  if ((event.metaKey || event.ctrlKey) && !$('scan').disabled) {
    if ($('url').value.trim()) addUrls($('url').value)
    $('url').value = ''
    desk('scan')
    return
  }
  addUrls($('url').value)
  $('url').value = ''
  $('url').focus()
})
$('url').addEventListener('paste', (event) => {
  const text = event.clipboardData?.getData('text') ?? ''
  // Several addresses at once become several rows straight away; one address waits for ENTER.
  if (/\s/.test(text.trim())) {
    event.preventDefault()
    addUrls(text)
    $('url').value = ''
  }
})
$('goto').addEventListener('keydown', (event) => { if (event.key === 'Enter') { event.preventDefault(); goTo() } })
$('dPending').addEventListener('click', (event) => {
  const id = event.target?.dataset?.remove
  if (id) desk('remove', { id: Number(id) })
})
$('health').addEventListener('dblclick', (event) => {
  const row = event.target.closest('tr[data-channel]')
  if (row) desk('goto', { number: Number(row.dataset.channel) })
})
$('previous').onclick = () => desk('previous')
$('next').onclick = () => desk('next')
$('gotoButton').onclick = goTo
$('skip').onclick = () => desk('skip')
$('needsMore').onclick = () => desk('needs-more')
$('scan').onclick = () => desk('scan')
$('scanNext').onclick = () => desk('scan', { andNext: true })
$('refreshChannel').onclick = () => desk('refresh')
$('deskStop').onclick = () => post('/api/stop')

// Shortcuts only when no field is being typed in, and never with a modifier held.
document.addEventListener('keydown', (event) => {
  const typing = event.target instanceof HTMLInputElement || event.target instanceof HTMLTextAreaElement || event.target?.isContentEditable
  if (typing || event.metaKey || event.ctrlKey || event.altKey || event.repeat) return
  const key = event.key.toLowerCase()
  const press = (id) => { if (!$(id).disabled) $(id).click(); event.preventDefault() }
  if (key === '/') { event.preventDefault(); $('url').focus() }
  else if (key === 'g') { event.preventDefault(); $('goto').focus() }
  else if (key === 's') press('scan')
  else if (key === 'n') press('next')
  else if (key === 'p') press('previous')
  else if (key === 'k') press('skip')
  else if (key === 'm') press('needsMore')
})

$('open').onclick = () => post('/api/workspace', { dir: $('dir').value.trim(), master: $('master').value.trim() })
$('start').onclick = () => post('/api/start', { from: $('autoFrom').value.trim(), to: $('autoTo').value.trim() })
$('stop').onclick = () => post('/api/stop')
$('resume').onclick = () => post('/api/resume')
$('export').onclick = () => post('/api/export')
$('report').onclick = () => post('/api/report')
$('folder').onclick = () => post('/api/open', { folder: '' })
refresh().then(() => $('url').focus())
setInterval(refresh, 1000)
</script>
</body>
</html>
